name: CI

on:
  push:
    branches: [main]
  # No `branches` filter here on purpose: for `pull_request` it matches the BASE
  # branch, so a stacked PR (base = another feature branch) was filtered out and
  # ran zero jobs while still looking reviewed. The 5-file / 300-line size
  # guardrail actively pushes work into stacks, so those are exactly the PRs the
  # gate must cover. Deploy workflows stay push-only (see their own headers).
  pull_request:

# Cancel redundant runs on the same branch when a new commit is pushed (M-2)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum required permissions — override per-job if needed (L-2)
permissions:
  contents: read

# ─── Backend Jobs ─────────────────────────────────────────────────────────────
# All backend jobs are skipped when backend/pyproject.toml does not exist yet.

jobs:
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-24.04
    outputs:
      backend-exists: ${{ steps.check.outputs.backend-exists }}
      frontend-exists: ${{ steps.check.outputs.frontend-exists }}
      prototype-exists: ${{ steps.check.outputs.prototype-exists }}
    steps:
      - uses: actions/checkout@v5
      - name: Check spec artifact sync
        run: scripts/check-spec-artifacts.sh
      # SC-045 requires a shell check, not a prose description, as the CI gate
      # for the bootstrap contract. This actually runs scripts/verify-bootstrap.sh
      # (see that script for what it proves), not just a file-presence check, so
      # a regression in the script itself — a changed factory signature, a
      # Settings field that now requires a value, a moved health path — fails
      # CI instead of silently rotting until someone runs it locally (issue
      # #417). It only needs `uv`: the script's own zero-prerequisite design
      # (default SQLite database_url, no container) means the `validate` job
      # does not need Postgres/Redis services or a `backend-test`-style env
      # block, and running it here — rather than in `backend-test`, whose job
      # env sets DATABASE_URL to Postgres — keeps that zero-prerequisite path
      # itself under test.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify bootstrap contract
        run: bash scripts/verify-bootstrap.sh
      - name: Check project structure
        id: check
        run: |
          echo "Checking project structure..."
          BACKEND_EXISTS=false
          FRONTEND_EXISTS=false
          PROTOTYPE_EXISTS=false

          if [ -f "backend/pyproject.toml" ]; then
            echo "✓ Backend exists - backend jobs will run"
            echo "backend-exists=true" >> $GITHUB_OUTPUT
            BACKEND_EXISTS=true
          else
            echo "ℹ Backend not yet implemented - backend jobs will be skipped"
            echo "backend-exists=false" >> $GITHUB_OUTPUT
          fi

          if [ -f "frontend/package.json" ]; then
            echo "✓ Frontend exists - frontend jobs will run"
            echo "frontend-exists=true" >> $GITHUB_OUTPUT
            FRONTEND_EXISTS=true
          else
            echo "ℹ Frontend not yet implemented - frontend jobs will be skipped"
            echo "frontend-exists=false" >> $GITHUB_OUTPUT
          fi

          if [ -f "design/prototype/package.json" ]; then
            echo "✓ Prototype exists - prototype jobs will run"
            echo "prototype-exists=true" >> $GITHUB_OUTPUT
            PROTOTYPE_EXISTS=true
          else
            echo "ℹ Prototype not yet implemented - prototype jobs will be skipped"
            echo "prototype-exists=false" >> $GITHUB_OUTPUT
          fi

          if [ "$BACKEND_EXISTS" = false ] && [ "$FRONTEND_EXISTS" = false ] && [ "$PROTOTYPE_EXISTS" = false ]; then
            echo "✓ Project structure validation complete. Early development phase: no backend/frontend/prototype code yet, all code jobs will be skipped."
          else
            echo "✓ Project structure validation complete. Additional CI jobs will now run and may pass or fail independently."
          fi

  sdd-lint:
    name: Project SDD Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check project SDD governance
        run: scripts/check-sdd.sh

  speckit-tests:
    name: Speckit Helper Scripts — Regression Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run speckit helper script regression tests
        run: scripts/speckit-tests.sh

  backend-ruff:
    name: Backend — Ruff (Lint + Format)
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.backend-exists == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --dev --locked
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Format check with Ruff
        run: uv run ruff format --check .

  backend-type-check:
    name: Backend — Type Check (mypy)
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.backend-exists == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --dev --locked
      - name: Type check with mypy
        run: uv run mypy .

  backend-security:
    name: Backend — Security Audit (pip-audit)
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.backend-exists == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install production dependencies only
        run: uv sync --no-dev --locked
      - name: Security audit with pip-audit
        # pip-audit is installed into an ephemeral overlay rather than added as
        # a dependency, so the audited environment stays exactly the production
        # dependency set that `uv sync --no-dev` just installed.
        run: uv run --no-dev --with pip-audit pip-audit --desc

  backend-test:
    name: Backend — Tests (pytest)
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.backend-exists == 'true'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: label_eval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d label_eval_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The `+asyncpg` driver is required: the backend builds an async engine,
      # and a bare `postgresql://` URL resolves to SQLAlchemy's default sync
      # driver (psycopg2), which the async engine cannot use.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/label_eval_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: "ci-test-only-not-a-real-secret"
      ENVIRONMENT: "test"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --dev --locked
      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80 --junitxml=junit.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: |
            backend/junit.xml
            backend/coverage.xml
          if-no-files-found: warn

# ─── Frontend Jobs ────────────────────────────────────────────────────────────
# Skipped when frontend/package.json does not exist yet.

  frontend-lint:
    name: Frontend — Lint & Type Check & Test & Build
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.frontend-exists == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'
          # `defaults.run.working-directory` only applies to `run` steps, so the
          # action resolves this path from the repo root and cannot find the
          # lockfile under frontend/ without it.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  frontend-security:
    name: Frontend — Security Audit (pnpm audit)
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.frontend-exists == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # pnpm audit checks the lockfile against the advisory DB; no install needed.
      # Severity threshold and --prod scoping are defined in ADR-028.
      - name: Security audit with pnpm audit
        run: pnpm audit --prod --audit-level high

  # TODO: Playwright E2E tests will be added once frontend development begins

# ─── Prototype Jobs ───────────────────────────────────────────────────────────
# Skipped when design/prototype/package.json does not exist yet.

  prototype-typecheck:
    name: Prototype — Type Check (tsc)
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.prototype-exists == 'true'
    defaults:
      run:
        working-directory: design/prototype
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: design/prototype/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck

  prototype-playwright:
    name: Prototype — Playwright Tests
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.prototype-exists == 'true'
    defaults:
      run:
        working-directory: design/prototype
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: design/prototype/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prototype-playwright-results
          path: design/prototype/playwright-report/
          if-no-files-found: warn
