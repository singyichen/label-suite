<!DOCTYPE html>
<!-- Spec: specs/dataset/016-dataset-analysis-list/spec.md -->
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Label Suite — 資料集分析</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="../shared/sidebar.css" />
  <link rel="stylesheet" href="../shared/empty-state.css" />
  <link rel="stylesheet" href="../shared/list-page.css" />
  <script src="../../assets/theme-fouc.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* Color/font/radius/shadow/spacing/motion/z-index tokens come from
       ../../assets/tokens.css; only page-local layout variables live here. */
    :root {
      --navbar-mobile-height: 84px; --navbar-mobile-top-height: 64px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background: var(--color-surface);
      color: var(--color-ink);
      line-height: 1.8;
      min-height: 100vh;
      display: flex; flex-direction: row;
    }
    html[lang="en"] body { line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    /* ── Layout ─────────────────────────────────────────────── */
    main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
    .layout { max-width: 1280px; width: 100%; margin: 0 auto; padding: var(--space-lg); }
    .page { min-width: 0; }

    /* ── Page header ────────────────────────────────────────── */
    .page-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: var(--space-md);
      margin-bottom: var(--space-lg); flex-wrap: wrap;
    }
    .page-main-title {
      font-family: var(--font-serif-display);
      font-size: 28px; line-height: 1.3; font-weight: 700;
      color: var(--color-ink); margin: 0 0 4px;
    }
    .page-main-subtitle { font-size: 14px; line-height: 1.8; color: var(--color-text-soft); margin: 0; }

    /* Page-owned sizes on top of shared/list-page.css */
    .filter-select { min-width: 160px; }

    /* ── Table panel ────────────────────────────────────────── */
    .table-container {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-white);
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .task-table { min-width: 760px; }
    .task-table tbody tr {
      cursor: pointer;
      transition: background var(--dur-fast);
    }
    .task-table tbody tr:hover { background: var(--color-slate-50); }
    .task-table tbody tr:last-child td { border-bottom: none; }
    .task-row:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 2px rgba(99, 102, 241, 0.18);
    }
    .task-name-cell {
      font-weight: 600;
      line-height: 1.4;
      color: var(--color-ink);
      white-space: normal;
      word-break: break-word;
    }

    /* ── Completion rate ────────────────────────────────────── */
    .completion-cell {
      min-width: 180px;
    }
    .completion-section { display: flex; flex-direction: column; gap: 6px; min-width: 140px; }
    .completion-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--color-text-soft); font-weight: 500;
      gap: 12px;
    }
    .completion-label strong { color: var(--color-ink); font-size: 13px; }
    .progress-track {
      height: 6px; background: var(--color-border-muted);
      border-radius: var(--radius-full); overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--color-primary);
      border-radius: var(--radius-full);
      transition: width var(--dur-normal) var(--ease-standard);
    }
    .progress-fill.complete { background: var(--color-cta); }

    .role-cell { color: var(--color-text-soft); font-size: 13px; }

    /* ── Badges ─────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: var(--radius-sm); border: 1px solid transparent;
      font-size: 12px; font-weight: 500; line-height: 1.4; white-space: nowrap;
    }
    .output-type-cell {
      min-width: 220px;
      max-width: 320px;
      white-space: normal;
    }
    .output-type-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }
    /* IAA status badges */
    .badge-iaa-pass        { color: var(--color-success);      background: var(--color-success-bg);      border-color: var(--color-success-border); }
    .badge-iaa-fail        { color: var(--color-error);        background: var(--color-error-bg);        border-color: var(--color-error-border);   }
    .badge-iaa-pending     { color: var(--color-warning);      background: var(--color-warning-bg);      border-color: var(--color-warning-border);  }
    .badge-iaa-not-started { color: var(--color-text-soft);    background: var(--color-slate-50);        border-color: var(--color-border);          }
    .badge-iaa-not-applicable { color: var(--color-text-soft); background: var(--color-slate-50);        border-color: var(--color-border);          border-style: dashed; }
    /* Role badge */
    .badge-role-pl    { color: var(--color-primary);  background: var(--color-primary-soft-bg); border-color: var(--color-primary-border); }
    .badge-role-rev   { color: var(--color-info);     background: var(--color-info-bg);         border-color: var(--color-info-border); }

    /* ── Empty state ─────────────────────────────────────────── */
    .error-title { font-size: 20px; font-weight: 700; color: var(--color-ink); margin: 0 0 8px; }
    .error-desc { font-size: 14px; color: var(--color-text-soft); margin: 0 0 16px; }
    .empty-state-row .empty-state-desc { margin-bottom: 0; }

    /* ── Toast (top-center, UXC-07 / MASTER §Toast) ─────────── */
    .toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: var(--z-toast);
      width: min(384px, calc(100vw - 32px));
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      /* shadow-md: Toast is an approved exception to the no-shadow rule */
      box-shadow: var(--shadow-md);
      opacity: 0;
      /* visibility keeps the hidden close button out of the tab order;
         its 0s transition is delayed so the fade-out still plays. */
      visibility: hidden;
      transition: opacity var(--dur-fast), visibility 0s var(--dur-fast);
    }
    .toast.visible { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity var(--dur-fast); }
    .toast-success { color: var(--color-success); background: var(--color-success-bg); border-color: var(--color-success-border); }
    .toast-info    { color: var(--color-info);    background: var(--color-info-bg);    border-color: var(--color-info-border); }
    .toast-warning { color: var(--color-warning); background: var(--color-warning-bg); border-color: var(--color-warning-border); }
    .toast-error   { color: var(--color-error);   background: var(--color-error-bg);   border-color: var(--color-error-border); }
    .toast-msg { flex: 1; }
    .toast-close {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.4;
      padding: 0;
    }
    .toast-close:hover { opacity: 1; }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 767px) {
      .layout { padding: var(--space-md) var(--space-md) var(--space-xl); }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar-left { flex-direction: column; align-items: stretch; width: 100%; }
      .search-wrap { width: 100%; min-width: 0; max-width: 100%; }
      .filter-select { width: 100%; min-width: 0; }
      .clear-btn.hide-clear { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
  </style>
  <link rel="stylesheet" href="../shared/task-type-badge.css" />
</head>

<body>

<!-- ══ SIDEBAR ════════════════════════════════════════════════ -->
<div id="sharedSidebarMount"></div>
<script src="../shared/sidebar.js"></script>

<!-- ══ MAIN ════════════════════════════════════════════════════ -->
<main>
  <div class="layout">
    <section class="page">

      <!-- Page header -->
      <header class="page-header">
        <div>
          <h1 class="page-main-title" id="pageTitle">資料集分析</h1>
          <p class="page-main-subtitle" id="pageSubtitle">資料集標記一致性與任務執行情形分析</p>
        </div>

      </header>

      <div class="toolbar" role="search" aria-label="資料集分析篩選">
        <div class="toolbar-left">
          <select class="filter-select" id="outputTypeFilter" aria-label="依輸出類型篩選">
            <option value="">全部輸出類型</option>
          </select>
          <select class="filter-select" id="iaaStatusFilter" aria-label="依 IAA 狀態篩選">
            <option value="">全部 IAA 狀態</option>
          </select>
          <button class="clear-btn hide-clear" id="clearFiltersBtn" aria-label="清除篩選">
            <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            <span id="clearFiltersLabel">清除篩選</span>
          </button>
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" class="search-input" id="searchInput" placeholder="搜尋" aria-label="搜尋" />
          </div>
        </div>
      </div>

      <div class="table-container">
        <div class="task-table-wrap" id="tableWrap">
          <table class="task-table" aria-label="資料集分析任務列表" id="taskTable">
            <thead>
              <tr>
                <th id="thTaskName">任務名稱</th>
                <th id="thTaskType">輸出類型</th>
                <th id="thCompletion">完成率</th>
                <th id="thIaaStatus">IAA 狀態</th>
                <th id="thRole">成員角色</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="paginationBar">
          <div class="pagination-left">
            <span class="pagination-info" id="paginationInfo"></span>
            <select class="page-size-select" id="pageSizeSelect" aria-label="每頁筆數">
              <option value="20" selected>20 筆/頁</option>
              <option value="50">50 筆/頁</option>
              <option value="100">100 筆/頁</option>
            </select>
          </div>
          <div class="pagination-controls" id="paginationControls">
            <button class="page-btn" id="prevPageBtn" aria-label="上一頁" disabled>
              <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="page-btn" id="nextPageBtn" aria-label="下一頁" disabled>
              <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
      </div>

    </section>
  </div>
</main>

<!-- ══ TOAST ════════════════════════════════════════════════════ -->
<div class="toast-container" aria-live="polite" aria-atomic="true">
  <div class="toast" id="toast">
    <span id="toastMsg" class="toast-msg"></span>
    <button type="button" class="toast-close" id="toastClose" aria-label="關閉通知">✕</button>
  </div>
</div>

</html>
