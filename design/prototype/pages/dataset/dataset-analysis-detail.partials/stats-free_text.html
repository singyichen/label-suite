<!-- Free-text Statistics -->
<section class="panel" aria-labelledby="statsFreeTextLenTitle">
  <div class="panel-head-row">
    <div>
      <h2 class="panel-title" id="statsFreeTextLenTitle" data-i18n="freeTextStats.lenTitle">回覆長度分佈</h2>
      <p class="panel-subtitle" id="statsFreeTextLenDesc" data-i18n="freeTextStats.lenDesc">標記員提交的自由文字回覆字數分佈（共 214 筆有效回覆）</p>
    </div>
  </div>
  <div style="margin-top:var(--space-md);display:grid;gap:10px;font-size:13px">
    <div style="display:flex;gap:var(--space-md)">
      <span style="color:var(--color-text-soft);min-width:140px" id="statsFreeTextMeanLabel" data-i18n="freeTextStats.meanLabel">平均字數</span>
      <span style="font-family:var(--font-mono);font-weight:600">86.4</span>
    </div>
    <div style="display:flex;gap:var(--space-md)">
      <span style="color:var(--color-text-soft);min-width:140px" id="statsFreeTextMedianLabel" data-i18n="freeTextStats.medianLabel">中位數字數</span>
      <span style="font-family:var(--font-mono);font-weight:600">72</span>
    </div>
    <div style="display:flex;gap:var(--space-md)">
      <span style="color:var(--color-text-soft);min-width:140px" id="statsFreeTextEmptyLabel" data-i18n="freeTextStats.emptyLabel">空白回覆比例</span>
      <span style="font-family:var(--font-mono);font-weight:600">1.4%</span>
    </div>
  </div>
</section>
