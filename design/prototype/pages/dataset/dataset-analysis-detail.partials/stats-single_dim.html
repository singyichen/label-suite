<!-- Single-dimension Scoring Statistics -->
<section class="panel" aria-labelledby="statsSingleDimHistTitle">

  </div>

    <g transform="translate(8,5)">
      <line x1="0" y1="0" x2="0" y2="115" stroke="var(--color-border)" stroke-width="1"/>

      <rect x="38"  y="91"  width="30" height="24"  fill="var(--color-primary)" opacity="0.6"  rx="2"/>
      <rect x="76"  y="52"  width="30" height="63"  fill="var(--color-primary)" opacity="0.75" rx="2"/>
      <rect x="114" y="0"   width="30" height="135" fill="var(--color-primary)" rx="2"/>
      <rect x="152" y="9"   width="30" height="106" fill="var(--color-primary)" opacity="0.85" rx="2"/>
      <text x="129" y="-3"  text-anchor="middle" font-size="9" fill="var(--color-primary)" font-weight="600">158</text>

      <text x="15"  y="129" text-anchor="middle" font-size="10" fill="var(--color-ink-muted)">1</text>
      <text x="53"  y="129" text-anchor="middle" font-size="10" fill="var(--color-ink-muted)">2</text>

    <div class="stats-summary-block">
      <div class="stats-summary-row">
        <div class="stats-summary-item">
          <span class="stats-summary-item-label" id="statsSingleDimLblMean" data-i18n="singleDimStats.mean">Mean</span>
