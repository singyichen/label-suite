    <h1>審核流程總覽</h1>
    <p class="standfirst">每一份樣本、每一個階段，都只交給一個人處理。標記員送出標記後，系統會把它交給一位審核員；審核員看完只有三種選擇：直接通過、直接改答案、或標成無法判定。通過就定稿；後兩種都不會馬上生效，會送進爭議池，交給另一位審核員做最後裁決。裁決者只能在「標記員的原答案」和「審核員的答案」之間二選一，如果兩邊都不能用，就交給專案負責人一筆一筆處理完。</p>

    <svg viewBox="0 0 1400 1008" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvov-title rvov-desc">
      <title id="rvov-title">審核流程總覽</title>
      <desc id="rvov-desc">這張圖用五個橫列表示誰負責哪一段：標記員、審核員、系統、仲裁者、專案負責人。標記員送出標記後成立一個審核單位，交給一位審核員處理。審核員逐項作業，通過與修改在按下送出審核之前都只是草稿，送出後才算數。審核員只有三種選擇：通過就直接定稿；直接改答案和標成無法判定都不會馬上生效，一律送進爭議池。爭議池由沒有參與這份標記的仲裁者逐項裁決，只能在標記員的原答案和審核員的答案之間二選一，不能自己寫第三種答案，也不會退回重標。如果審核員是直接改答案，那一邊就顯示他改成什麼；如果審核員標的是無法判定，那一邊就顯示無法判定，選了就等於定案為無法判定。仲裁者若認為兩邊都不能用，必須填寫理由，這一項會落到最終例外池，由專案負責人一筆一筆處理：採用原答案、採用審核員的答案、自己填答案，或把這筆從資料集移除；例外池清空才能結案。定稿的內容只顯示文字、不能再修改，並附一行處理歷程，最後集中流入標記結果與匯出。審核單位只有三種狀態：待審、爭議中、已定稿。以前的做法，包括要幾位審核員才開始計票、已同意與已修改兩個中間狀態、逐項比票數、以及退回重標，都已經取消。圖的下方比較兩種任務的差別：一份樣本會有幾個審核單位、審核怎麼分配、定稿之後產生什麼。</desc>
