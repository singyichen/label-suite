    <h1>審核流程總覽</h1>
    <p class="standfirst">審核單位 = 一份樣本 × 一位標記員 × 一種執行類型。狀態由三個系統判斷推導——人數是否達門檻、審核員有無改動答案、逐項計票是否收斂——而不是由通過／退回按鈕直接決定。試標與正式標記走同一條判斷路徑，差別只有底部那三處。</p>

    <svg viewBox="0 0 1400 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvov-title rvov-desc">
      <title id="rvov-title">Label Suite 審核流程總覽</title>
      <desc id="rvov-desc">四泳道流程圖：標記員提交標記後交給審核員逐單位審核；系統依序判斷審核人數是否達門檻、審核員是否改動答案或純退回（退回且未改動答案）、逐項嚴格多數決是否收斂。計票時，已提交審核但該項未改動且非純退回的審核員其票計給標記員原答案，尚未提交者不計入分母；全員都改動或純退回時原答案不列為候選；純退回不計為對原答案的同意票，恆不收斂；門檻為 1 時唯一審核員之修正逕行收斂於該值，未達已提交人數一半（門檻 ≥ 2 時）亦不收斂；收斂則定稿唯讀，平手、全分歧或含純退回則落入爭議池由具仲裁資格的審核員逐項裁定後定稿——純退回之爭議項無替代值，裁定維持退回即維持原判斷不寫入新值。底部對照表列出試標與正式標記的三處差異：一筆樣本產生幾個審核單位、退回是否回退標記員狀態、以及定稿是否產生審核 gold（審核流程定案產出的答案，與資料集自帶的 gold_label 欄位無關）。試標不產生審核 gold，其品質改由兩條獨立輸入呈現：標記員原始答案彙總為標記一致性，審核員的審核決策彙總為標記員被修改率。</desc>
