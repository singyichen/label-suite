    <h1>審核流程總覽</h1>
    <p class="standfirst">審核單位 = 一份樣本 × 一位標記員 × 一種執行類型。每筆資料、每個階段只交給一個人：審核員一次決策就決定定稿或進爭議池，仲裁者逐項裁定 A／B 或判兩者皆非，剩下的由專案負責人在最終例外池逐筆收尾。狀態由審核員的單一決策與仲裁裁定推導；試標與正式標記共用同一條路徑，差別只在人員怎麼搭。</p>

    <svg viewBox="0 0 1400 1008" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvov-title rvov-desc">
      <title id="rvov-title">Label Suite 審核流程總覽</title>
      <desc id="rvov-desc">五泳道流程圖，呈現「三層單人接力」的審核收斂路徑：標記員提交標記後成立審核單位，交給一位審核員逐單位審核；通過與修正在送出審核前只是草稿，按下送出審核才寫入決策。審核員只有三個出口——通過直接定稿；直接修正與無法判定（Bypass）都不立即生效，一律進爭議池。爭議池由未參與該單位的具仲裁資格審核員逐項裁定，只在 A（標記員原答案）與 B 之間選邊，不開放第三答案也不重標；B 依來源動態渲染，來源是修正時顯示審核員的修正值，來源是 Bypass 時顯示「審核員 Bypass（無法判定）」，採 B 即定案為無法判定。仲裁者若判「兩者皆非」則必填理由並送入最終例外池，由專案負責人逐筆收尾——採 A、採 B、以原始標記介面填寫自訂答案（定案理由必填），或自資料集排除；例外池清空是任務結案條件。定稿單位以純文字唯讀卡呈現，附一行微型衝突歷程，並集中流入標記結果與匯出。審核單位只有三態：待審、爭議中、已定稿；舊模型的審核人數門檻、已同意／已修改過渡態、逐項嚴格多數決與退回重標迴路皆已退場。底部對照表列出試標與正式標記的三處差異：一筆樣本的審核單位數（試標為標記員數 N，正式為 1）、審核指派粒度（試標以樣本為單位、同筆全部標記交同一位審核員，正式逐筆自名冊輪派）、定稿的產物（試標不產生定案答案，改彙總標記一致性與標記員被修改率；正式產生定案答案）。</desc>
