    <h1>正式標記、多數決與仲裁詳細流程</h1>
    <p class="standfirst">判斷路徑與試標完全相同——差別有三處：正式標記每筆樣本恰指派一位標記員（試標則由多位重疊標記，一筆樣本因此拆成多個審核單位）、正式標記的退回會把樣本退回標記員重標，而正式標記的定稿判斷會產生審核 gold——指審核流程定案產出的答案，與資料集自帶的 gold_label 欄位是兩回事。嚴格多數決要求票數嚴格大於人數的一半，已提交審核但該項未改動的審核員，其票算給標記員的原標（尚未提交者不計入分母），因此平手、三方全分歧或任何未過半的分佈都無法收斂。右欄是 T017 平手案例的實際推導。</p>

      <title id="rvoff-title">正式標記、多數決與仲裁詳細流程</title>
      <desc id="rvoff-desc">流程圖：正式標記提交後由審核員逐單位審核，退回會把樣本狀態退回待標記並產生重標待辦。先判斷已審人數是否達門檻，未達則停在已同意或已修改的過渡狀態；達門檻後判斷審核員是否改動答案，無人改動即定稿，有改動則進入逐項嚴格多數決，票數需嚴格大於人數的一半才算收斂並定稿，平手或全分歧則落入爭議池，由具仲裁資格且未參與該單位審核的審核員逐項裁定 A 標記員或 B 審核員後定稿。正式標記的定稿判斷會產生審核 gold（審核流程定案產出的答案，與資料集自帶的 gold_label 欄位無關），且每筆樣本恰指派一位標記員因此只產生一個審核單位。右欄標註 T017 oft-01-even-tie 一比一平手案例的推導，含仲裁資格為名冊屬性的說明。底部為任務層級的完成 gate 與匯出，完成 gate 共五項前置條件。</desc>
