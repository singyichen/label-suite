    <h1>正式標記審核流程</h1>
    <p class="standfirst">每筆樣本固定一位標記員、一個審核單位，審核員自名冊逐筆輪派。收斂路徑與試標完全相同——通過即定稿，直接修正與無法判定（Bypass）都進爭議池由仲裁者在 A／B 之間選邊，判「兩者皆非」則落入最終例外池由專案負責人收尾。差別在於：正式標記的定稿會產出定案答案，而且不退回重標；任務要全數通過且最終例外池清空才算完成。</p>

    <svg viewBox="0 0 1200 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvof-title rvof-desc">
      <title id="rvof-title">正式標記審核流程詳細圖</title>
      <desc id="rvof-desc">分為審核單位層與任務層兩段。審核單位層：每筆樣本恰由一位標記員標記，提交後成立唯一的審核單位，審核員自名冊逐筆輪派，一筆一位審核員，標記員不會審自己的標記。審核員逐項作業，通過與修正在按下送出審核前都只是草稿，送出後才寫入決策。決策只有三個出口——通過直接定稿；直接修正與無法判定（Bypass）都不立即生效，一律進爭議池。爭議池由未參與該單位的具仲裁資格審核員逐項裁定，只能在 A（標記員原答案）與 B 之間選邊，不開放第三答案，且正式標記不退回重標；B 依來源動態渲染，來源是修正時顯示審核員的修正值，來源是 Bypass 時顯示「審核員 Bypass（無法判定）」，採 B 即定案為無法判定。仲裁者若判「兩者皆非」需填理由並送入最終例外池，由專案負責人逐筆收尾：採 A、採 B、以原始標記介面填寫自訂答案（僅限合法答案空間、定案理由必填），或自資料集排除。定稿單位以純文字唯讀卡呈現並附微型衝突歷程，集中產出定案答案，可追溯至來源單位與定案者。任務層：完成條件是全部樣本通過且最終例外池清空，任務才轉為已完成並可匯出定案答案。審核單位只有待審、爭議中、已定稿三態；舊模型的審核人數門檻、已同意／已修改過渡態、逐項嚴格多數決與退回重標迴路皆已退場。</desc>
