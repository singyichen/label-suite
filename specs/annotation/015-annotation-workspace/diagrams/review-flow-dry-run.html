    <h1>試標審核流程</h1>
    <p class="standfirst">同一筆資料由多位標記員重複標記，審核以樣本為單位指派——同筆的 N 份標記全部交同一位審核員。審核員一次決策就決定去向：通過即定稿，直接修正與無法判定（Bypass）都進爭議池，交仲裁者逐項在 A／B 之間選邊；判「兩者皆非」則落入最終例外池，由專案負責人逐筆收尾。試標不產生定案答案，跑完只彙總標記一致性與標記員被修改率，供主持人判讀要開正式標記還是修訂指引再跑一輪。</p>

    <svg viewBox="0 0 1200 1248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvdr-title rvdr-desc">
      <title id="rvdr-title">試標審核流程詳細圖</title>
      <desc id="rvdr-desc">分為審核單位層與任務層兩段。審核單位層：標記員提交試標後成立審核單位；審核以樣本為單位指派，同一筆資料的 N 份標記全部交同一位審核員，同一位標記員不會審自己的標記。審核員逐單位逐項作業，通過與修正在按下送出審核前都只是草稿，送出後才寫入決策。決策只有三個出口——通過直接定稿；直接修正與無法判定（Bypass）都不立即生效，一律進爭議池。爭議池由未參與該單位的具仲裁資格審核員逐項裁定，只能在 A（標記員原答案）與 B 之間選邊，不開放第三答案也不退回重標；B 依來源動態渲染，來源是修正時顯示審核員的修正值，來源是 Bypass 時顯示「審核員 Bypass（無法判定）」，採 B 即定案為無法判定。仲裁者若判「兩者皆非」需填理由並送入最終例外池，由專案負責人逐筆收尾：採 A、採 B、以原始標記介面填寫自訂答案（僅限合法答案空間、定案理由必填），或自資料集排除；前三者回到已定稿，排除則不進定稿。任務層：全體標記員提交完成後任務轉為待 IAA 確認，系統以標記員原始答案彙總標記一致性（IAA），以審核員的審核決策彙總標記員被修改率，兩者交由專案主持人判讀，決定開放正式標記或修訂指引後再跑一輪；同一批決策同時回饋為標記員可見的試標歷史，形成不退回重標的學習閉環。審核單位只有待審、爭議中、已定稿三態。</desc>
