    <h1>試標審核流程</h1>
    <p class="standfirst">試標是「先小規模跑一次，看看大家標得一不一樣」。同一份資料會由多位標記員各標一次，這些標記全部交給同一位審核員看。審核員只有三種選擇：通過、直接改答案、或標成無法判定。通過就定稿；改答案和無法判定都不會馬上生效，會送進爭議池，交給另一位審核員做最後裁決，只能在標記員的原答案和審核員的答案之間二選一。兩邊都不能用時，就交給專案負責人一筆一筆處理完。試標不會產生最終答案，跑完只統計大家標得多一致、誰被改得多，讓主持人決定要開放正式標記，還是修改標註指引後再跑一輪。</p>

    <svg viewBox="0 0 1200 1248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvdr-title rvdr-desc">
      <title id="rvdr-title">試標審核流程</title>
      <desc id="rvdr-desc">分成單筆流程與整批流程兩段。單筆流程：標記員送出試標後成立審核單位；同一份資料的所有標記會交給同一位審核員，而且不會讓人審到自己標的。審核員逐項作業，通過與改答案在按下送出審核之前都只是草稿，送出後才算數。決定只有三個出口：通過就直接定稿；直接改答案和標成無法判定都不會馬上生效，一律送進爭議池。爭議池由沒有參與這份標記的審核員逐項裁決，只能在標記員的原答案和審核員的答案之間二選一，不能自己寫第三種答案，也不會退回重標；如果審核員是直接改答案，那一邊就顯示他改成什麼，如果審核員標的是無法判定，那一邊就顯示無法判定，選了就等於定案為無法判定。裁決者若認為兩邊都不能用，必須填寫理由並送進最終例外池，由專案負責人一筆一筆處理：採用原答案、採用審核員的答案、用原本的標記畫面自己填答案（只能填合法答案並寫理由），或把這筆從資料集移除；前三種回到已定稿，移除的不會定稿。整批流程：所有標記員都送出後，任務轉為待確認階段。系統用標記員的原始答案算出標記一致性，用審核員的決定算出每個人被修改的比例，兩項一起交給專案主持人判讀，決定開放正式標記或修改指引後再跑一輪；同一批決定也會回饋給標記員，讓他們看得到自己哪幾項被改、被誰定案，不用退回重標也能學到。審核單位只有待審、爭議中、已定稿三種狀態。</desc>

      <text x="900" y="86" fill="#1E1B4B" font-size="11" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif">① 怎麼分配</text>
      <text x="900" y="102" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">同一份資料由三位標記員各標一次，</text>
      <text x="900" y="115" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">產生三份標記，全部交給同一位審核員。</text>

      <text x="900" y="146" fill="#1E1B4B" font-size="11" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif">② 審核員的三種選擇</text>

      <text x="900" y="201" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">第三份被標成無法判定 → 一樣進爭議池。</text>
      <text x="900" y="214" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">審核員沒有「退回」，試標不退回重標。</text>

      <text x="900" y="245" fill="#1E1B4B" font-size="11" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif">③ 裁決只能二選一</text>
      <text x="900" y="261" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">一邊是標記員的原答案，另一邊是審核員的：</text>
      <text x="900" y="274" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">審核員如果是改答案，就顯示他改成什麼；</text>
      <text x="900" y="287" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">如果標的是無法判定，就顯示無法判定，</text>
      <text x="900" y="300" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">選了這邊就等於定案為無法判定。</text>
      <text x="900" y="313" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">不能自己寫第三種答案，也不退回重標。</text>

      <text x="900" y="344" fill="#1E1B4B" font-size="11" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif">④ 兩邊都不能用</text>

      <text x="900" y="386" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">採用原答案、採用審核員答案、自己填，</text>
      <text x="900" y="399" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace">或把這筆從資料集移除。</text>
      <text x="900" y="412" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">例外池清空，任務才能結案。</text>
