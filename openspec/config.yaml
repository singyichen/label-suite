schema: spec-driven

# Phase 2 configuration per docs/openspec-adoption-plan.md and ADR-033.
# openspec/specs/ is a DERIVED view; the canonical truth lives in specs/.
# List items use >- block scalars so embedded colons (e.g. "對應 Spec:") stay
# plain text instead of being parsed as YAML mapping keys.

context: |
  Label Suite — configurable NLP data labeling and automated evaluation portal
  (master's thesis demo). Modular monorepo; prototype phase is static HTML under
  design/prototype/ with Playwright tests; backend FastAPI / frontend React are
  planned per specs/foundation/000-foundation/plan.md.

  Canonical spec baseline: when proposing a change, the current state MUST be
  read from specs/[module]/NNN-feature/spec.md (modules: account, dashboard,
  task-management, annotation, dataset, admin; merged features are archived
  under specs/_archive/). openspec/specs/ is a derived view only — on any
  conflict, specs/[module]/NNN-feature/spec.md wins. Archive write-back must
  bump the canonical spec version and add a Changelog entry.

  Governance: specs/_governance/constitution.md (eight principles;
  Generalization-First and Data Fairness are NON-NEGOTIABLE). Conversations in
  Traditional Chinese; code, commits, and PR descriptions in English.

  Language (HARD RULE, 2026-08-25): every OpenSpec-produced artifact
  (proposal.md, spec deltas, design.md, tasks.md, derived views) MUST be
  written in Traditional Chinese, keeping only technical terms in English —
  FR/AC IDs, code identifiers, commands, file paths, and OpenSpec structural
  keywords (## ADDED/MODIFIED/REMOVED Requirements, ### Requirement:,
  #### Scenario:, WHEN/THEN). These documents are reviewed by the maintainer
  in Traditional Chinese.

rules:
  proposal:
    - >-
      Frontmatter MUST name the canonical spec it changes, e.g.
      "對應 Spec: specs/[module]/NNN-feature/spec.md".
    - >-
      MUST include a constitution-check section walking the design-time
      principles of specs/_governance/constitution.md relevant to the change.
    - >-
      Spec deltas MUST reference stable FR/AC IDs
      (e.g. "MODIFIED Requirement: FR-NNN"); never paraphrase a requirement
      without its ID.
    - >-
      Every cited FR/AC ID MUST be locatable via grep in the canonical
      spec.md (Source-Verify gate).
    - >-
      HARD RULE: body text MUST be Traditional Chinese; only technical terms
      and OpenSpec structural keywords stay in English (see context).
  design:
    - >-
      design.md is OPTIONAL by default (KISS), but MANDATORY when the change
      touches an API contract or a DB schema; it must then contain the
      contract definition (endpoints / schema / migration impact).
    - >-
      MUST include a constitution-check section when present.
    - >-
      May reference specs/foundation/000-foundation/plan.md as the standing
      architecture baseline.
    - >-
      HARD RULE: body text MUST be Traditional Chinese; only technical terms
      and OpenSpec structural keywords stay in English (see context).
  specs:
    - >-
      Delta spec files MUST reference stable FR/AC IDs from the canonical
      spec.md; new requirements get the next free FR/AC ID in that spec.
    - >-
      Derived capability files MUST carry a header naming the canonical path
      (specs/[module]/NNN-feature/spec.md) and the corresponding FR/AC IDs.
    - >-
      No delta headings (e.g. "## ADDED Requirements") may remain in derived
      views after archive.
    - >-
      HARD RULE: requirement and scenario body text MUST be Traditional
      Chinese; delta/structural headings, FR/AC IDs, and WHEN/THEN keywords
      stay in English (see context).
  tasks:
    - >-
      TDD is required: every implementation task is preceded by a failing
      test task; never implement before the test exists and fails.
    - >-
      Task granularity must keep each PR within ≤ 5 files / ≤ 300 diff lines
      (tests excluded), or state the split plan explicitly.
    - >-
      HARD RULE: task descriptions MUST be Traditional Chinese; commands,
      file paths, and code identifiers stay in English (see context).
    - >-
      Agent assignment: every task line MUST end with exactly one inline
      assignee tag `[@agent-name]` naming an agent defined in .claude/agents/
      (e.g. [@senior-backend], [@senior-dba], [@senior-frontend],
      [@senior-devops], [@senior-qa]), or [@main] for tasks the main session
      must run itself (openspec CLI workflows, PR operations, archive
      write-back).
    - >-
      Execution defaults to strictly serial. Wrap same-group tasks that may
      run concurrently in <!-- parallel:start --> / <!-- parallel:end -->
      markers, and state cross-group parallelism and dependencies in a
      blockquote under each group heading; anything unmarked runs serial.

operations:
  apply:
    guidance:
      - >-
        Run the verification commands from CLAUDE.md for the touched area
        (backend uv run pytest/mypy/ruff; frontend pnpm tsc/lint/test;
        prototype corepack pnpm typecheck + playwright) — all must exit 0
        before a task is considered done.
      - >-
        Never commit to main; branch per CLAUDE.md naming
        (<type>/<short-description>).
      - >-
        Dispatch each task to the subagent named by its [@agent-name] tag
        (Agent tool with the matching agent type); [@main] tasks run in the
        main session. The main session stays the orchestrator: it hands the
        subagent the task text plus the change's context files, requires
        incremental commits on long tasks, verifies the task's verification
        command exits 0, and marks the checkbox itself. Honor the tasks.md
        parallel markers and dependency blockquotes; use worktree isolation
        only when a parallel group touches the same files.
  archive:
    guidance:
      - >-
        Write back to the canonical spec.md (version bump + Changelog entry)
        before regenerating derived views.
      - >-
        Verify every FR/AC ID touched by the change greps in the canonical
        spec.md (Source-Verify gate) and no delta headings remain in
        openspec/specs/.
