<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試標審核詳細流程（流程圖）</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #F5F3FF; --color-ink: #1E1B4B; --color-muted: #64748B; --color-accent: #6366F1;
      --font-sans:  'Inter', 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif;
      --font-serif: 'Crimson Pro', 'Noto Serif TC', Georgia, serif;
      --font-mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; margin-bottom: 0.5rem; }
    .standfirst { font-family: var(--font-serif); font-style: italic; font-size: 0.95rem;
      color: var(--color-muted); margin-bottom: 1.5rem; max-width: 62ch; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">流程圖 · 試標審核</p>
    <h1>試標審核詳細流程</h1>
    <p class="standfirst">試標的同一份樣本由多位標記員各自提交，因此拆成多個獨立審核單位。試標沒有「退回個人重標」這條通道——退回只寫審核紀錄，標記員狀態不動。</p>

    <svg viewBox="0 0 1080 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvdry-title rvdry-desc">
      <title id="rvdry-title">試標審核詳細流程</title>
      <desc id="rvdry-desc">流程圖：試標提交後拆成樣本乘標記員的審核單位，審核員逐單位審核；先判斷已審人數是否達門檻，未達則停在已同意或已修改的過渡狀態等待下一位審核員；達門檻後再判斷審核員是否改動答案，未改動即定稿唯讀，有改動則落入爭議池，由具仲裁資格的審核員逐項裁定後定稿。退回在試標只記錄審核決策，不改變標記員狀態。</desc>

      <defs>
        <marker id="arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748B"/></marker>
        <marker id="arw-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6366F1"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5F3FF"/>

      <!-- ══ Connectors ══ -->
      <path d="M 440 92 V 140" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 440 192 V 228" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 344 272 H 256" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 168 244 V 174 A 8 8 0 0 0 176 166 H 344" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arw)"/>
      <path d="M 440 316 V 380" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 440 468 V 592" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 536 424 H 680" fill="none" stroke="#6366F1" stroke-width="1.4" marker-end="url(#arw-ac)"/>
      <path d="M 768 452 V 520" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 680 548 H 608 A 8 8 0 0 0 600 556 V 612 A 8 8 0 0 1 592 620 H 536" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 536 166 H 680" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arw)"/>

      <!-- ══ Connector labels ══ -->
      <rect x="250" y="252" width="100" height="12" rx="2" fill="#F5F3FF"/>
      <text x="300" y="261" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">否 · 未達門檻</text>

      <rect x="174" y="200" width="88" height="12" rx="2" fill="#F5F3FF"/>
      <text x="178" y="209" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">下一位審核員</text>

      <rect x="446" y="342" width="104" height="12" rx="2" fill="#F5F3FF"/>
      <text x="450" y="351" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">是 · 已達門檻</text>

      <rect x="446" y="520" width="112" height="12" rx="2" fill="#F5F3FF"/>
      <text x="450" y="529" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">否 · 答案完全一致</text>

      <rect x="560" y="404" width="104" height="12" rx="2" fill="#F5F3FF"/>
      <text x="612" y="413" fill="#6366F1" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">是 · 有任何改動</text>

      <rect x="774" y="480" width="96" height="12" rx="2" fill="#F5F3FF"/>
      <text x="778" y="489" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">僅具仲裁資格者</text>

      <rect x="612" y="528" width="84" height="12" rx="2" fill="#F5F3FF"/>
      <text x="654" y="537" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">逐項裁定完成</text>

      <rect x="580" y="146" width="40" height="12" rx="2" fill="#F5F3FF"/>
      <text x="600" y="155" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">退回</text>

      <!-- ══ Nodes ══ -->
      <!-- 1 · start oval -->
      <rect x="344" y="48" width="192" height="44" rx="20" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="440" y="68" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">試標提交</text>
      <text x="440" y="82" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">試標 · 多位標記員各自提交</text>

      <!-- 2 · 審核員逐單位審核 -->
      <rect x="344" y="140" width="192" height="52" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="440" y="163" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">審核員逐單位審核</text>
      <text x="440" y="178" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">單位 = 樣本 × 標記員 × 試標</text>

      <!-- 3 · diamond 門檻 -->
      <polygon points="440,228 536,272 440,316 344,272" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="440" y="269" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">已審人數達門檻？</text>
      <text x="440" y="283" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">需幾位審核員才開始計票</text>

      <!-- 5 · 過渡狀態 -->
      <rect x="80" y="244" width="176" height="56" rx="6" fill="#1E1B4B0D" stroke="#64748B" stroke-width="1"/>
      <text x="168" y="267" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">過渡狀態</text>
      <text x="168" y="284" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">已同意 / 已修改</text>

      <!-- 4 · diamond 改動 -->
      <polygon points="440,380 536,424 440,468 344,424" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="440" y="421" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">審核員改動答案？</text>
      <text x="440" y="435" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">逐一比對每個輸出欄位</text>

      <!-- 7 · 爭議池 -->
      <rect x="680" y="396" width="176" height="56" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="768" y="419" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">爭議池</text>
      <text x="768" y="436" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">爭議中 · 逐項列管</text>

      <!-- 8 · 仲裁 -->
      <rect x="680" y="520" width="176" height="56" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="768" y="543" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">仲裁者逐項裁定</text>
      <text x="768" y="560" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">A 標記員 / B 審核員</text>

      <!-- 9 · 退回註記 (optional/dashed) -->
      <rect x="680" y="140" width="280" height="52" rx="6" fill="#1E1B4B08" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="820" y="163" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">退回：只寫入審核決策</text>
      <text x="820" y="178" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">標記員狀態不變 · 無重標待辦</text>

      <!-- 6 · 已定稿 (FOCAL) -->
      <rect x="344" y="592" width="192" height="56" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
      <text x="440" y="615" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">已定稿 · 唯讀</text>
      <text x="440" y="632" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">最終狀態 · 沒有解鎖入口</text>

      <!-- Editorial callout -->
      <text x="80" y="392" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">示範任務 T014 只需 1 位審核員即計票，</text>
      <text x="80" y="412" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">左側過渡狀態在此設定下不會出現：</text>
      <text x="80" y="432" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">任一審核員改動即直接落入爭議池。</text>
      <text x="80" y="464" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">品質問題交由標記者一致性閘門處理，</text>
      <text x="80" y="484" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">下一輪試標再修正，不走個人重標。</text>

      <!-- ══ Legend：五態（沿用產品 status pill 配色） ══ -->
      <line x1="40" y1="672" x2="1040" y2="672" stroke="rgba(30,27,75,0.10)" stroke-width="0.8"/>
      <text x="40" y="688" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">審核單位五態</text>

      <rect x="40" y="700" width="52" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="66" y="711" fill="#64748B" font-size="9" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">待審</text>
      <text x="100" y="711" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">尚未有人審核</text>

      <rect x="168" y="700" width="52" height="16" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="194" y="711" fill="#1D4ED8" font-size="9" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">已同意</text>
      <text x="228" y="711" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">答案與原標一致</text>

      <rect x="308" y="700" width="52" height="16" rx="4" fill="#FEFCE8" stroke="#FEF08A" stroke-width="1"/>
      <text x="334" y="711" fill="#A16207" font-size="9" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">已修改</text>
      <text x="368" y="711" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">有改動但人數未達</text>

      <rect x="448" y="700" width="52" height="16" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
      <text x="474" y="711" fill="#B91C1C" font-size="9" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">爭議中</text>
      <text x="508" y="711" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">無法收斂（終態）</text>

      <rect x="620" y="700" width="52" height="16" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <text x="646" y="711" fill="#15803D" font-size="9" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">已定稿</text>
      <text x="680" y="711" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace">仲裁完成（終態）</text>
    </svg>
  </div>
</body>
</html>
