<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label Suite 審核流程總覽 · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:      #F5F3FF;
      --color-paper-2:    #FFFFFF;
      --color-ink:        #1E1B4B;
      --color-muted:      #64748B;
      --color-soft:       #94A3B8;
      --color-accent:     #6366F1;
      --font-sans:  'Inter', 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif;
      --font-serif: 'Crimson Pro', 'Noto Serif TC', Georgia, serif;
      --font-mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600; letter-spacing: -0.01em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 0.5rem;
    }
    .standfirst {
      font-family: var(--font-serif); font-style: italic;
      font-size: 0.95rem; color: var(--color-muted);
      margin-bottom: 1.5rem; max-width: 62ch;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Label Suite Review</p>
    <h1>審核流程總覽</h1>
    <p class="standfirst">審核單位 = 樣本 × 標記員 × run_type。狀態由「審核員是否改動答案」與「審核人數是否達門檻」兩軸推導，並非由通過／退回按鈕直接決定。</p>

    <svg viewBox="0 0 1240 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvov-title rvov-desc">
      <title id="rvov-title">Label Suite 審核流程總覽</title>
      <desc id="rvov-desc">四泳道流程圖：標記員提交標記後交給審核員逐單位審核；系統依審核人數門檻與嚴格多數決判斷是否收斂，收斂則定稿唯讀，未收斂或平手則落入爭議池由具仲裁資格的審核員逐項裁定後定稿；僅正式標記的退回會將樣本退回標記員重新標記。</desc>

      <defs>
        <marker id="arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748B"/></marker>
        <marker id="arw-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6366F1"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5F3FF"/>

      <!-- Lane dividers -->
      <line x1="40" y1="96"  x2="1200" y2="96"  stroke="rgba(30,27,75,0.22)" stroke-width="1"/>
      <line x1="40" y1="208" x2="1200" y2="208" stroke="rgba(30,27,75,0.10)" stroke-width="1"/>
      <line x1="40" y1="320" x2="1200" y2="320" stroke="rgba(30,27,75,0.10)" stroke-width="1"/>
      <line x1="40" y1="432" x2="1200" y2="432" stroke="rgba(30,27,75,0.10)" stroke-width="1"/>
      <line x1="40" y1="544" x2="1200" y2="544" stroke="rgba(30,27,75,0.22)" stroke-width="1"/>
      <!-- Actor column divider -->
      <line x1="192" y1="96" x2="192" y2="544" stroke="rgba(30,27,75,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="56" y="156" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">標記員</text>
      <text x="56" y="268" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">審核員</text>
      <text x="56" y="380" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">系統</text>
      <text x="56" y="492" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">仲裁者</text>

      <!-- ══ Connectors (drawn before nodes) ══ -->

      <!-- 1. 提交標記 → 開啟審核單位 (L1→L2 handoff) -->
      <path d="M 384 140 H 492 A 8 8 0 0 1 500 148 V 240" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <!-- 2. 開啟審核單位 → 通過/修正/退回 (within L2) -->
      <path d="M 576 264 H 616" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <!-- 3. 通過/修正/退回 → 彙總 (L2→L3 handoff) -->
      <path d="M 696 288 V 352" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <!-- 4. 彙總 → 嚴格多數決 (within L3) -->
      <path d="M 776 376 H 816" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <!-- 5. 彙總 → 開啟審核單位 (n < min，等下一位審核員；loop) -->
      <path d="M 616 376 H 508 A 8 8 0 0 1 500 368 V 288" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arw)"/>
      <!-- 6. 嚴格多數決 → 已定稿 -->
      <path d="M 968 376 H 1008" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <!-- 7. 嚴格多數決 → 爭議池 (L3→L4) -->
      <path d="M 892 400 V 464" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <!-- 8. 爭議池 → 逐項裁定 (CORAL: 關鍵交接) -->
      <path d="M 968 488 H 1008" fill="none" stroke="#6366F1" stroke-width="1.4" marker-end="url(#arw-ac)"/>
      <!-- 9. 逐項裁定 → 已定稿 (L4→L3) -->
      <path d="M 1096 464 V 400" fill="none" stroke="#6366F1" stroke-width="1.4" marker-end="url(#arw-ac)"/>
      <!-- 10. 通過/修正/退回 → 重新標記 (僅 official_run；L2→L1) -->
      <path d="M 696 240 V 176" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arw)"/>
      <!-- 11. 重新標記 → 提交標記 (loop back，繞行 lane 1 上緣) -->
      <path d="M 696 128 V 120 A 8 8 0 0 0 688 112 H 316 A 8 8 0 0 0 308 120 V 128" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arw)"/>

      <!-- ══ Connector labels (mask + text) ══ -->
      <rect x="434" y="188" width="60" height="12" rx="2" fill="#F5F3FF"/>
      <text x="490" y="197" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end" letter-spacing="0.06em">submitted</text>

      <rect x="702" y="306" width="80" height="12" rx="2" fill="#F5F3FF"/>
      <text x="706" y="315" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">寫入審核結果</text>

      <rect x="768" y="356" width="56" height="12" rx="2" fill="#F5F3FF"/>
      <text x="796" y="365" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">n ≥ min</text>

      <rect x="438" y="326" width="56" height="12" rx="2" fill="#F5F3FF"/>
      <text x="466" y="335" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">n &lt; min</text>

      <rect x="960" y="356" width="52" height="12" rx="2" fill="#F5F3FF"/>
      <text x="986" y="365" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">收斂</text>

      <rect x="898" y="420" width="88" height="12" rx="2" fill="#F5F3FF"/>
      <text x="902" y="429" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">未收斂 · 平手</text>

      <rect x="952" y="468" width="72" height="12" rx="2" fill="#F5F3FF"/>
      <text x="988" y="477" fill="#6366F1" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">仲裁資格</text>

      <rect x="1102" y="420" width="76" height="12" rx="2" fill="#F5F3FF"/>
      <text x="1106" y="429" fill="#6366F1" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">裁定 A 或 B</text>

      <rect x="600" y="196" width="90" height="12" rx="2" fill="#F5F3FF"/>
      <text x="690" y="205" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end" letter-spacing="0.06em">僅正式標記退回</text>

      <rect x="460" y="118" width="64" height="12" rx="2" fill="#F5F3FF"/>
      <text x="492" y="127" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">重新提交</text>

      <!-- ══ Nodes ══ -->
      <!-- L1 · 提交標記 -->
      <rect x="232" y="128" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="308" y="150" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">提交標記</text>
      <text x="308" y="164" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">dry_run / official_run</text>

      <!-- L1 · 重新標記 -->
      <rect x="616" y="128" width="160" height="48" rx="6" fill="#1E1B4B0D" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="696" y="150" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">重新標記</text>
      <text x="696" y="164" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">status → pending</text>

      <!-- L2 · 開啟審核單位 -->
      <rect x="424" y="240" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="500" y="262" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">開啟審核單位</text>
      <text x="500" y="276" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">樣本 × 標記員 × run</text>

      <!-- L2 · 通過 / 修正 / 退回 -->
      <rect x="616" y="240" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="696" y="262" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">通過 / 修正 / 退回</text>
      <text x="696" y="276" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">逐項決策 · 可直接改答案</text>

      <!-- L3 · 彙總 · 審核人數門檻 -->
      <rect x="616" y="352" width="160" height="48" rx="6" fill="#1E1B4B0D" stroke="#64748B" stroke-width="1"/>
      <text x="696" y="374" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">彙總 · 審核人數門檻</text>
      <text x="696" y="388" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">min_reviewers</text>

      <!-- L3 · 嚴格多數決 -->
      <rect x="816" y="352" width="152" height="48" rx="6" fill="#1E1B4B0D" stroke="#64748B" stroke-width="1"/>
      <text x="892" y="374" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">嚴格多數決</text>
      <text x="892" y="388" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">count &gt; n / 2</text>

      <!-- L3 · 已定稿（FOCAL） -->
      <rect x="1008" y="352" width="176" height="48" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
      <text x="1096" y="374" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">已定稿 · 唯讀</text>
      <text x="1096" y="388" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">finalized · 終態</text>

      <!-- L4 · 爭議池 -->
      <rect x="816" y="464" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="892" y="486" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">爭議池</text>
      <text x="892" y="500" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">disputed · 逐項列管</text>

      <!-- L4 · 逐項裁定 -->
      <rect x="1008" y="464" width="176" height="48" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="1096" y="486" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">逐項裁定 A / B</text>
      <text x="1096" y="500" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">不重新標記</text>

      <!-- Editorial callout (審核員 lane, 右側空白) -->
      <text x="816" y="258" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">試標的「退回」只留下審核決策紀錄，</text>
      <text x="816" y="276" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">不會把樣本退回標記員重標。</text>

      <!-- ══ Legend ══ -->
      <line x1="40" y1="576" x2="1200" y2="576" stroke="rgba(30,27,75,0.10)" stroke-width="0.8"/>
      <text x="40" y="592" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="608" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="60" y="616" fill="#64748B" font-size="8.5" font-family="'Inter','Noto Sans TC',sans-serif">人為動作</text>

      <rect x="152" y="608" width="14" height="10" rx="2" fill="#1E1B4B0D" stroke="#64748B" stroke-width="1"/>
      <text x="172" y="616" fill="#64748B" font-size="8.5" font-family="'Inter','Noto Sans TC',sans-serif">系統推導</text>

      <rect x="264" y="608" width="14" height="10" rx="2" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
      <text x="284" y="616" fill="#64748B" font-size="8.5" font-family="'Inter','Noto Sans TC',sans-serif">終態（唯讀）</text>

      <line x1="400" y1="613" x2="428" y2="613" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <text x="436" y="616" fill="#64748B" font-size="8.5" font-family="'Inter','Noto Sans TC',sans-serif">主流程</text>

      <line x1="528" y1="613" x2="556" y2="613" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arw)"/>
      <text x="564" y="616" fill="#64748B" font-size="8.5" font-family="'Inter','Noto Sans TC',sans-serif">循環 / 條件分支</text>

      <line x1="700" y1="613" x2="728" y2="613" stroke="#6366F1" stroke-width="1.4" marker-end="url(#arw-ac)"/>
      <text x="736" y="616" fill="#64748B" font-size="8.5" font-family="'Inter','Noto Sans TC',sans-serif">仲裁交接（唯一可跨越爭議池的路徑）</text>
    </svg>
  </div>
</body>
</html>
