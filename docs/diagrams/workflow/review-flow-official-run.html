    <h1>正式標記、多數決與仲裁詳細流程</h1>
    <p class="standfirst">嚴格多數決要求票數嚴格大於 n／2；未提出異議的審核員，其票算給標記員的原標。因此平手或三方全分歧都無法收斂，只能進爭議池等待仲裁。右欄是 T017 平手案例的實際推導。</p>

    <svg viewBox="0 0 1200 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rvoff-title rvoff-desc">
